<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — GSE Work Order Creator (Thai Lion Air)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Prompt & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

  <!-- Background decorative glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-rose-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md">
    
    <!-- Header Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl space-y-6">
      
      <!-- Brand & Title -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-amber-500 shadow-lg shadow-rose-600/30 text-white text-2xl mb-2">
          <i class="fa-solid fa-plane-departure"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-wide">
          THAI LION AIR
        </h1>
        <p class="text-xs font-semibold uppercase tracking-widest text-rose-400">
          GSE Work Order Creator
        </p>
        <p class="text-xs text-slate-400">
          กรุณาเข้าสู่ระบบด้วยรหัสพนักงานเพื่อเปิดใบงาน eMRO
        </p>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="bg-rose-500/15 border border-rose-500/40 rounded-xl p-3.5 flex items-center gap-3 text-rose-300 text-xs">
        <i class="fa-solid fa-circle-exclamation text-rose-400 text-base"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-4">
        
        <!-- User ID Input -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">
            <i class="fa-solid fa-id-badge text-rose-400 mr-1"></i> รหัสพนักงาน (User ID)
          </label>
          <div class="relative">
            <input type="text" name="username" required autofocus placeholder="เช่น TL123456" value="{{ username or '' }}"
                   class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono text-white placeholder-slate-600 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 uppercase transition">
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">
            <i class="fa-solid fa-lock text-rose-400 mr-1"></i> รหัสผ่าน (Password)
          </label>
          <div class="relative">
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono text-white placeholder-slate-600 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition">
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit"
                  class="w-full bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-rose-600/30 transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ (Sign In)
          </button>
        </div>

      </form>

      <!-- Footer Info -->
      <div class="pt-4 border-t border-slate-800 text-center">
        <p class="text-[11px] text-slate-500">
          eMRO Automation & Work Order Management System
        </p>
      </div>

    </div>

  </div>

</body>
</html>

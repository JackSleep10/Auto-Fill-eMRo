<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — GSE Work Order Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'IBM Plex Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      background-color: #09090B;
      color: #F4F4F5;
      caret-color: #F43F5E;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.035), transparent 55%),
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    ::selection {
      background: rgba(244, 63, 94, 0.28);
      color: #FFFFFF;
    }
    :focus-visible {
      outline: 2px solid rgba(244, 63, 94, 0.65);
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

  <main class="w-full max-w-[390px]">
    <div class="bg-[#111113]/95 border border-zinc-800/80 rounded-2xl p-7 sm:p-8 shadow-[0_24px_64px_rgba(0,0,0,0.65)] backdrop-blur-md space-y-6">

      <!-- Brand & Title -->
      <header class="flex flex-col items-center text-center space-y-2.5">
        <span class="inline-flex items-center justify-center text-rose-500 text-xl" aria-hidden="true">
          <i class="fa-solid fa-plane-departure"></i>
        </span>
        <div class="space-y-1">
          <h1 class="text-xl font-semibold text-zinc-100 tracking-tight">
            GSE Work Order
          </h1>
          <p class="text-xs text-zinc-400">
            Thai Lion Air — เข้าสู่ระบบด้วยรหัสพนักงาน
          </p>
        </div>
      </header>

      <!-- Error Alert -->
      {% if error %}
      <p role="alert" class="text-rose-400 text-xs flex items-center gap-2 py-2 border-y border-rose-500/25">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span>{{ error }}</span>
      </p>
      {% endif %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-4">
        <div class="space-y-1.5">
          <label for="username" class="block text-xs font-medium text-zinc-300">
            รหัสพนักงาน <span class="text-zinc-500 font-normal">(User ID)</span>
          </label>
          <input id="username" type="text" name="username" required autofocus
                 placeholder="TL123456" value="{{ username or '' }}"
                 class="w-full bg-[#09090B] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500/30 uppercase transition">
        </div>

        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-medium text-zinc-300">
            รหัสผ่าน <span class="text-zinc-500 font-normal">(Password)</span>
          </label>
          <input id="password" type="password" name="password" required
                 placeholder="••••••••"
                 class="w-full bg-[#09090B] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500/30 transition">
        </div>

        <div class="pt-1.5">
          <button type="submit"
                  class="w-full bg-zinc-100 hover:bg-white active:bg-zinc-200 text-zinc-950 font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 text-sm cursor-pointer">
            <span>เข้าสู่ระบบ</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </form>

      <!-- Footer -->
      <footer class="pt-4 border-t border-zinc-800/80 flex items-center justify-between text-[11px] text-zinc-500">
        <span>eMRO Automation</span>
        <span class="font-mono">DMK · TLM</span>
      </footer>

    </div>
  </main>

</body>
</html>
